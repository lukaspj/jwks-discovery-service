apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jwks-discovery-service.fullname" . }}
  labels:
    {{- include "jwks-discovery-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jwks-discovery-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jwks-discovery-service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jwks-discovery-service.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- $credSecret := "" }}
          {{- if .Values.credentials.create }}
          {{- $credSecret = printf "%s-credentials" (include "jwks-discovery-service.fullname" .) }}
          {{- else if .Values.credentials.existingSecret }}
          {{- $credSecret = .Values.credentials.existingSecret }}
          {{- end }}
          {{- if or $credSecret .Values.existingConfigMap }}
          envFrom:
            {{- if .Values.existingConfigMap }}
            - configMapRef:
                name: {{ .Values.existingConfigMap }}
            {{- end }}
            {{- if $credSecret }}
            - secretRef:
                name: {{ $credSecret }}
            {{- end }}
          {{- end }}
          {{- if not .Values.existingConfigMap }}
          env:
            - name: MANIFEST_BUCKET
              value: {{ required "config.bucket is required" .Values.config.bucket | quote }}
            - name: MANIFEST_PREFIX
              value: {{ .Values.config.prefix | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.region | quote }}
            - name: RESCAN_INTERVAL
              value: {{ .Values.config.rescanInterval | toString | quote }}
            {{- if .Values.config.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.config.endpoint | quote }}
            - name: S3_PATH_STYLE
              value: {{ .Values.config.pathStyle | quote }}
            {{- end }}
            {{- if .Values.publicURL }}
            - name: PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
