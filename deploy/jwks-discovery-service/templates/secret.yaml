{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jwks-discovery-service.fullname" . }}-credentials
  labels:
    {{- include "jwks-discovery-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "credentials.accessKeyId is required when credentials.create=true" .Values.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "credentials.secretAccessKey is required when credentials.create=true" .Values.credentials.secretAccessKey | quote }}
  {{- with .Values.credentials.sessionToken }}
  AWS_SESSION_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
