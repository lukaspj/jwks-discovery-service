replicaCount: 2

image:
  repository: ghcr.io/lukaspj/jwks-discovery-service
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # IRSA example:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/jwks-discovery-service

# S3 manifest source and service behavior.
config:
  bucket: ""            # required – MANIFEST_BUCKET
  prefix: "manifests/"  # MANIFEST_PREFIX
  region: "eu-west-1"   # AWS_REGION
  rescanInterval: 60s   # RESCAN_INTERVAL
  # kid computation style: rfc7638 (default), spki-b64url (kube-apiserver
  # service-account token signer), or spki-hex (client-go keyutil).
  kidStyle: rfc7638     # KID_STYLE
  # Optional custom S3-compatible endpoint (e.g. MinIO) and path style:
  endpoint: ""
  pathStyle: false

# S3 credentials. Preferred path is IRSA via serviceAccount.annotations
# (no static credentials). Otherwise reference an existing Secret or let
# the chart create one. Keys expected by the AWS SDK env chain:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (optional).
credentials:
  existingSecret: ""   # e.g. jwks-s3-credentials
  create: false
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""

# External base URL used to build OIDC issuer / jwks_uri values
# (e.g. https://keys.example.com). Empty = derive from request Host.
publicURL: ""

# Use an existing ConfigMap with the env keys instead of `config` above.
existingConfigMap: ""

service:
  type: ClusterIP
  port: 80

probes:
  liveness:
    initialDelaySeconds: 2
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# No kubelet service-account token needed (IRSA webhook injects its own
# projected token when serviceAccount.annotations is used).
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  # Matches the nonroot user in the distroless image (uid/gid 65532).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels: {}

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
