# One service definition per YAML file in the bucket, e.g.
#   s3://my-bucket/manifests/payments.yaml
name: payments

# Arbitrary service configuration (opaque to the JWKS service; kept for
# future use or by consumers that also read these manifests).
config:
  audience: https://payments.example.com
  issuer: https://payments.example.com

# PEM certificate blob. May contain the leaf certificate followed by
# intermediates. Public keys are extracted; each unique key becomes one
# JWK with kid = RFC 7638 thumbprint.
cert: |
  -----BEGIN CERTIFICATE-----
  MIIDazCCAlOgAwIBAgIUXo6Y5F0L3DRrVQ0qT3dBvGj0oJowDQYJKoZIhvcNAQEL
  BQAwRTELMAkGA1UEBhMCQVUxEzARBgNVBAgMClNvbWUtU3RhdGUxITAfBgNVBAoM
  GEludGVybmV0IFdpZGdpdHMgUHR5IEx0ZDAeFw0yNTAxMDEwMDAwMDBaFw0yNzAx
  ... (leaf certificate)
  -----END CERTIFICATE-----
  -----BEGIN CERTIFICATE-----
  ... (intermediate, optional)
  -----END CERTIFICATE-----
